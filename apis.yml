description: Pixate was a code-free, drag-and-drop mobile prototyping platform that let
  designers build sophisticated, fluid interactive prototypes running natively on iOS and
  Android devices. Founded as an interaction-design startup and backed by a16z, Pixate was
  acquired by Google in July 2015 and discontinued on October 31, 2016. The pixate.com domain
  now serves only a Google-hosted farewell notice; there is no product, developer portal,
  documentation, SDK, or API surface remaining to enrich. This profile is retained as a
  historical portfolio record.
